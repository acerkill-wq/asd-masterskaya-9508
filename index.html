<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Сметная мастерская АСД</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F4;--surface:#FFFFFF;--surface2:#F6F8FA;--ink:#121A24;--ink2:#465366;--muted:#8793A3;
  --line:#E2E7ED;--line2:#EDF0F4;--brand:#0EA5A4;--brand-d:#0B7F7E;--brand-soft:#E1F6F5;--brand-ink:#075E5E;
  --ot:#0EA5A4;--em:#F2A93B;--m:#7C6CF0;--nr:#EF5B7A;--sp:#64748B;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 10px 30px rgba(16,24,40,.07);--shadow-s:0 1px 2px rgba(16,24,40,.06);
  --r:12px;--font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --warn:#B45309;--warn-bg:#FEF3C7;
}
[data-theme=dark]{
  --bg:#0C1116;--surface:#151C23;--surface2:#1A232B;--ink:#E9EEF3;--ink2:#B0BBC7;--muted:#7B8896;
  --line:#26313B;--line2:#1F2A33;--brand:#2DD4BF;--brand-d:#5EEAD4;--brand-soft:#11322F;--brand-ink:#99F6E4;
  --ot:#2DD4BF;--em:#FBBF4A;--m:#9A8CFF;--nr:#FB7092;--sp:#94A3B8;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);--shadow-s:0 1px 2px rgba(0,0,0,.4);
  --warn:#FBBF4A;--warn-bg:#3A2D10;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
td.mono{white-space:nowrap}.rb,.switch,.ctl{white-space:nowrap}
.mono{font-family:var(--mono);font-size:11.5px;letter-spacing:-.2px}

#app{height:100vh;display:grid;grid-template-rows:auto auto auto 1fr auto;grid-template-columns:minmax(0,1fr);min-width:1180px}



/* --- Помощь ИИ --- */
.aip{position:fixed;right:16px;top:150px;bottom:96px;width:420px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);display:none;flex-direction:column;z-index:60;overflow:hidden}
.aip.on{display:flex}
.aip .ah{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
.aip .ah .i{color:var(--brand)}
.aip .ah .st{margin-left:auto;font-weight:500;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.aip .ah .st:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.aip .ah .st.ok:before{background:#22A06B}.aip .ah .st.off:before{background:var(--warn)}
.aip .ax{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}.aip .ax:hover{background:var(--surface2)}
.aip .ab{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.aip .hint{color:var(--ink2);font-size:12.5px;line-height:1.5}
.aip .m{max-width:100%;padding:9px 12px;border-radius:12px;font-size:12.8px;line-height:1.5;white-space:normal;word-wrap:break-word}
.aip .m.u{align-self:flex-end;background:var(--brand-soft);color:var(--brand-ink);max-width:85%}
.aip .m.a{align-self:flex-start;background:var(--surface2);border:1px solid var(--line2)}
.aip .m.a.err{background:var(--warn-bg);color:var(--warn)}
.aip .m .src{margin-top:6px;font-size:11px;color:var(--muted)}
.aip .m .unv{margin-top:6px;font-size:11px;color:var(--warn)}
.aip .m.wait{color:var(--muted)}
.aip .pk{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.aip .pc{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.aip .pc .mono{color:var(--brand-ink)}.aip .pc .pn{grid-column:1;font-size:12px}.aip .pc .pw{grid-column:1;font-size:11.5px;color:var(--ink2)}
.aip .pc button{grid-column:2;grid-row:1/4;align-self:center;padding:6px 10px;border-radius:8px;background:var(--brand);color:#fff;font-weight:600;font-size:12px}
.aip .aq{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px 0;border-top:1px solid var(--line)}
.aip .aq button{padding:6px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--ink2);background:var(--surface)}
.aip .aq button:hover{border-color:var(--brand);color:var(--brand-ink)}
.aip .ai{display:flex;gap:8px;padding:10px 14px 14px}
.aip .ai textarea{flex:1;resize:none;height:58px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:12.8px;background:var(--surface);color:var(--ink)}
.aip .ai textarea:focus{outline:none;border-color:var(--brand)}
.aip .ai button{width:40px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center}

/* --- титул --- */
.titlebar{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:-.2px}
.logo small{display:block;font-weight:500;font-size:10.5px;color:var(--muted);letter-spacing:.2px;margin-top:-2px}
.doc{display:flex;align-items:center;gap:8px;margin-left:8px;padding-left:16px;border-left:1px solid var(--line)}
.doc input{font-weight:600;font-size:14px;background:transparent;border:1px solid transparent;border-radius:8px;padding:5px 8px;min-width:260px}
.doc input:hover{border-color:var(--line)}.doc input:focus{outline:2px solid var(--brand);background:var(--surface2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;background:var(--brand-soft);color:var(--brand-ink)}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--brand)}
.modes{margin-left:auto;display:flex;gap:2px;background:var(--surface2);border:1px solid var(--line);padding:3px;border-radius:12px}
.modes button{padding:6px 14px;border-radius:9px;font-weight:600;font-size:12.5px;color:var(--ink2)}
.modes button.on{background:var(--surface);color:var(--brand-ink);box-shadow:var(--shadow-s)}
.modes button[disabled]{opacity:.55;cursor:default}
.modes button em{font-style:normal;font-size:9.5px;margin-left:5px;padding:1px 5px;border-radius:99px;background:var(--line);color:var(--muted);font-weight:600}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--brand),var(--m))}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;color:var(--ink2)}
.iconbtn:hover{background:var(--surface2)}

/* --- меню --- */
.menubar{display:flex;gap:2px;padding:4px 14px;background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:30}
.menubar>button{padding:5px 11px;border-radius:8px;font-weight:500;color:var(--ink2)}
.menubar>button:hover,.menubar>button.open{background:var(--surface2);color:var(--ink)}
.menubar .hint{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;padding:3px 10px;border:1px solid var(--line);border-radius:9px;cursor:pointer;background:var(--surface2)}
.menubar .hint kbd,.kbd{font-family:var(--mono);font-size:10.5px;padding:1px 5px;border-radius:5px;background:var(--surface);border:1px solid var(--line);color:var(--ink2)}
.dd{position:absolute;top:100%;min-width:260px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:60;animation:pop .12s ease-out}
.dd button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 10px;border-radius:8px}
.dd button:hover:not([disabled]){background:var(--brand-soft);color:var(--brand-ink)}
.dd button[disabled]{color:var(--muted);cursor:default}
.dd .sc{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.dd .soon{margin-left:auto;font-size:10px;padding:1px 6px;border-radius:99px;background:var(--line2);color:var(--muted)}
.dd hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.dd .ck{width:16px;text-align:center;color:var(--brand)}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}

/* --- лента --- */
.ribbon{display:flex;align-items:stretch;gap:6px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.grp{display:flex;gap:2px;padding:0 8px;border-right:1px solid var(--line)}
.grp:last-child{border-right:0}
.rb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 10px;min-width:58px;border-radius:10px;font-size:11px;font-weight:500;color:var(--ink2);transition:.12s}
.rb svg{color:var(--ink)}
.rb:hover:not([disabled]){background:var(--surface2)}
.rb:active:not([disabled]){transform:scale(.97)}
.rb[disabled]{opacity:.38;cursor:default}
.rb.pri{background:var(--brand);color:#fff}.rb.pri svg{color:#fff}.rb.pri:hover{background:var(--brand-d)!important}
.rb.ai{background:linear-gradient(135deg,var(--brand),var(--m));color:#fff}.rb.ai svg{color:#fff}.rb.ai:hover{filter:brightness(1.08);background:linear-gradient(135deg,var(--brand),var(--m))!important}
.ribbon .sp{flex:1}
.ctl{display:flex;flex-direction:column;justify-content:center;gap:5px;padding:0 10px;font-size:11px;color:var(--muted);font-weight:500}
.ctl select{font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:5px 8px}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink);user-select:none}
.switch i{width:32px;height:18px;border-radius:99px;background:var(--line);position:relative;transition:.15s;flex:none}
.switch i:after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:.15s}
.switch.on i{background:var(--brand)}.switch.on i:after{left:16px}

/* --- рабочая область --- */
.work{display:grid;grid-template-columns:300px minmax(0,1fr) 356px;gap:12px;padding:12px;min-height:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-s);min-height:0;display:flex;flex-direction:column;overflow:hidden}
.ph{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;font-weight:700;font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.ph .n{margin-left:auto;font-weight:600;letter-spacing:0;text-transform:none}

/* каталог */
.search{margin:0 12px 8px;display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;color:var(--muted)}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.search input{flex:1;border:0;background:none;outline:none;min-width:0;color:var(--ink)}
.tree{overflow:auto;padding:0 8px 10px;flex:1}
.sec{margin-bottom:2px}
.cgrp{margin-bottom:4px}.cgrp>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:9px 8px;border-radius:9px;cursor:pointer;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.02em;color:var(--muted)}.cgrp>summary::-webkit-details-marker{display:none}.cgrp>summary:hover{background:var(--surface2)}.cgrp>summary svg{transition:.15s;width:14px;height:14px}.cgrp[open]>summary svg{transform:rotate(90deg)}.cgrp>summary .c{margin-left:auto;font-weight:500;font-size:11px;text-transform:none}.cgrp>.sec{margin-left:8px}
.sec>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:9px;cursor:pointer;font-weight:600;font-size:12.5px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary:hover{background:var(--surface2)}
.sec>summary .cn{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:6px;background:var(--brand-soft);color:var(--brand-ink)}
.sec>summary svg{transition:.15s;width:14px;height:14px;color:var(--muted)}
.sec[open]>summary svg{transform:rotate(90deg)}
.sec>summary .c{margin-left:auto;color:var(--muted);font-weight:500;font-size:11px}
.rate{position:relative;display:block;padding:8px 40px 8px 12px;margin:1px 0 1px 12px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.rate:hover{background:var(--surface2);border-color:var(--line)}
.rate .rc{display:flex;gap:6px;align-items:center;color:var(--muted)}
.rate .rn{font-size:12.5px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rate .ru{font-size:10.5px;padding:1px 6px;border-radius:99px;background:var(--line2);color:var(--ink2)}
.rate .add{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--brand);color:#fff;opacity:0;transition:.12s}
.rate:hover .add{opacity:1}
.rate .add svg{width:16px;height:16px;stroke-width:2.2}
.empty-s{padding:20px 14px;color:var(--muted);text-align:center}

/* таблица */
.sheet{position:relative}
.tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line)}
.tabs button{padding:8px 14px;border-radius:9px 9px 0 0;font-weight:600;color:var(--muted);position:relative}
.tabs button.on{color:var(--brand-ink)}
.tabs button.on:after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--brand);border-radius:2px}
.tabs .tr{margin-left:auto;display:flex;align-items:center;gap:8px;padding-bottom:6px}
.tablewrap{overflow:auto;flex:1}
table{border-collapse:separate;border-spacing:0;width:100%}
thead th{position:sticky;top:0;z-index:5;background:var(--surface2);text-align:left;font-size:11px;font-weight:600;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th.r,td.r{text-align:right}
tbody td{padding:0 10px;height:48px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr.pos{cursor:default;animation:rowin .22s ease-out}
@keyframes rowin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
tbody tr.pos:hover td{background:var(--surface2)}
tbody tr.pos.sel td{background:var(--brand-soft)}
tbody tr.pos.sel td:first-child{box-shadow:inset 3px 0 0 var(--brand)}
td.nm{max-width:360px;min-width:220px}
td.nm .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:500}
td.nm .kk{display:flex;gap:4px;margin-top:2px;flex-wrap:wrap}
.kc{font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--warn-bg);color:var(--warn)}
.qin{width:88px;text-align:right;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px;font-variant-numeric:tabular-nums;font-weight:600}
.qin:hover{border-color:var(--line);background:var(--surface)}
.qin:focus{outline:2px solid var(--brand);background:var(--surface)}
.u{color:var(--muted);font-size:11.5px}
td.tot{font-weight:700;position:relative}
td.tot .bar{position:absolute;left:8px;right:8px;bottom:6px;height:3px;border-radius:3px;background:var(--line2);overflow:hidden}
td.tot .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--m));border-radius:3px}
tr.sc td{background:var(--surface2);height:38px;font-weight:700;border-bottom:1px solid var(--line)}
tr.sc td .st{font-weight:600;color:var(--ink2)}
tr.sc.sel td{background:var(--brand-soft)}
.compact .c-ext{display:none}
.empty{height:100%;display:grid;place-items:center;text-align:center;padding:30px;color:var(--ink2)}
.empty h3{margin:10px 0 4px;font-size:17px;color:var(--ink)}
.empty p{margin:0 auto 16px;max-width:380px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;font-weight:600;border:1px solid var(--line);background:var(--surface)}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.pri:hover{background:var(--brand-d)}
.sub-table{padding:14px}
.rsh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:10px}.rsh h4{margin-bottom:2px}.rsb{display:flex;gap:6px;flex-wrap:wrap}.rsg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.rsc{display:flex;gap:8px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:10px;font-size:12px;min-width:150px}.rsc b{font-size:14px}.rsc.tot{background:var(--surface-2,var(--surface));border-width:2px}tr.rst td{font-weight:600;border-top:1px solid var(--line)}tr.rsw td{color:var(--warn)}
.vbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 14px 4px}
.vbar .sp{flex:1}
.vt input{width:100%;border:1px solid transparent;background:transparent;border-radius:8px;padding:5px 7px;font:inherit;color:inherit}
.vt input:hover{border-color:var(--line)}.vt input:focus{border-color:var(--brand);background:var(--surface);outline:none}
.vt input.vf{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.vt input.bad{border-color:#d9534f;background:rgba(217,83,79,.08)}
.vt td{vertical-align:middle}.vt .vv{font-weight:700;white-space:nowrap}
.vlink{display:inline-flex;gap:6px;align-items:center;padding:3px 8px;border-radius:8px;background:var(--brand-soft);color:var(--brand-ink);font-size:11.5px;font-weight:600;cursor:pointer;margin:2px 4px 2px 0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.vpick{padding:4px 10px;border-radius:8px;border:1px dashed var(--brand);color:var(--brand-ink);background:transparent;font-size:12px;font-weight:600;cursor:pointer}
.vpick.on{background:var(--brand);color:#fff;border-style:solid}
.vst{font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;white-space:nowrap}
.vst.ok{background:var(--brand-soft);color:var(--brand-ink)}.vst.w{background:var(--warn-bg);color:var(--warn)}
.vdel{opacity:.35;cursor:pointer;border:0;background:transparent;font-size:15px}.vdel:hover{opacity:1}
.qwrap{display:inline-flex;align-items:center;gap:4px}
.qtag{font-size:10px;font-weight:700;padding:1px 5px;border-radius:5px;background:var(--brand-soft);color:var(--brand-ink);cursor:pointer;white-space:nowrap}
.qin[readonly]{color:var(--brand-ink);cursor:pointer}
.pickbar{position:sticky;top:0;z-index:2;margin:0 0 6px;padding:8px 10px;border-radius:10px;background:var(--brand);color:#fff;font-size:12px;font-weight:600;display:flex;gap:8px;align-items:center}
.pickbar button{margin-left:auto;border:0;border-radius:7px;padding:3px 8px;background:rgba(255,255,255,.2);color:#fff;cursor:pointer}
.sub-table h4{margin:0 0 8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

/* инспектор */
.insp{overflow:auto}
.ih{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.ih .code{display:inline-block;margin-bottom:6px}
.ih h3{margin:0;font-size:14.5px;line-height:1.3}
.sect{padding:12px 16px;border-bottom:1px solid var(--line)}
.sect h5{margin:0 0 8px;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.qrow{display:flex;align-items:center;gap:8px}
.qrow input{width:110px;font-size:16px;font-weight:700;text-align:right;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}
.qrow input:focus{outline:2px solid var(--brand);background:var(--surface)}
.conv{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--brand-soft);color:var(--brand-ink);font-size:12px}
.kr{display:flex;align-items:center;gap:10px;padding:7px 0}
.kr .kn{flex:1}.kr .kn b{display:block;font-weight:600}.kr .kn span{font-size:11px;color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:6px}

  if(r.t==='ЭМ'){const m=PR.mach[rc];if(m){if(m[0]!=null)return {price:m[0],otm:m[1]||0,src:'ФГИС ЦС'};const dl=m[4]?PR.lab[m[4]]:null;const o=r2(dl!=null?(r.lab||0)*dl:r.otm);if(m[3]!=null&&m[2]!=null)return {price:r2(m[2]*m[3])+o,otm:o,src:'базис × индекс'}}return {price:r.price,otm:r.otm,src:'базис, индекса нет'}}

function stub(p){return {R:{name:'Загрузка данных…',nat:'',unit:'',mult:1,comp:[],sec:''},q:0,ot:0,otm:0,emN:0,em:0,mat:0,direct:0,fot:0,nr:0,sp:0,total:0,nrp:0,spp:0,lines:[],warn:[]}}
function calcReal(p,R){
  const q=p.qty/R.mult;let kprod=1,kpay=1,klab=1,rem=false;
  for(const id of p.ks||[]){const c=RC[id];if(!c)continue;if(c.type==='prod')kprod+=c.v-1;else if(c.type==='pay')kpay*=c.v;else if(c.type==='lab')klab*=c.v;else rem=true}
  kprod=Math.round(kprod*1e7)/1e7;kpay=Math.round(kpay*1e7)/1e7;
  const kl=kprod*klab*(rem?1.15:1),km=kprod*(rem?1.25:1);
  let ot=0,otm=0,emN=0,mat=0,zt=0,ztm=0;const lines=[],warn=[];
  for(const [rc,n0] of R.comp){const r=B.res[rc];if(!r)continue;const n=n0==='П'?n0:ucNorm(p.code,rc,n0);
    if(r.t==='ТР'){lines.push({rc,t:'ТР',name:r.name,unit:r.unit,norm:n,qty:null,price:null,sum:null});continue}
    const pr=rp(rc);
    if(n==='П'){warn.push('расход «П» (по проекту): '+r.name);lines.push({rc,t:r.t,name:r.name,unit:r.unit,norm:'П',qty:null,price:pr.price,src:pr.src,sum:null});continue}
    if(pr.price==null){warn.push('нет цены: '+r.name);continue}
    const base=n*q;let qty=base,sum=0;
    if(r.t==='ОТ'){qty=base*kl;zt+=qty;sum=qty*pr.price*kpay;ot+=sum}
    else if(r.t==='ЭМ'){qty=base*km;ztm+=qty*(r.lab||0);emN+=qty*(pr.price-pr.otm);const o=qty*pr.otm*kpay;otm+=o;sum=qty*(pr.price-pr.otm)+o}
    else{sum=base*pr.price;mat+=sum}
    lines.push({rc,t:r.t,name:r.name,unit:r.unit,norm:n,norm0:n0,qty,price:pr.price,otm:pr.otm,src:pr.src,sum});
  }
  const I=null;
  ot=r2(ot);otm=r2(otm);emN=r2(emN);mat=r2(mat);
  const em=r2(emN+otm),direct=r2(ot+em+mat),fot=r2(ot+otm);
  const NS=NRSET(),nv=NS.nr[R.nk],sv=NS.sp[R.sk];if(NS.meta&&NS.meta.fallback){if(NS.meta.fallback.includes('nr '+R.nk))warn.push('НР '+R.nk+': прежняя редакция не разобрана, взят действующий норматив');if(NS.meta.fallback.includes('sp '+R.sk))warn.push('СП '+R.sk+': прежняя редакция не разобрана, взят действующий норматив')}if(!nv)warn.push('не найдена строка норматива НР (Пр/812-'+R.nk+')');if(!sv)warn.push('не найдена строка норматива СП (Пр/774-'+R.sk+')');
  const nrp=nv?nv[0]:0,spp=sv?sv[0]:0;
  const nr=r2(fot*nrp/100*(rem?0.9:1)),sp=r2(fot*spp/100*(rem?0.85:1));
  return {R,q,kprod,kpay,klab,rem,I,ot,otm,emN,em,mat,direct,fot,nr,sp,total:r2(direct+nr+sp),nrp,spp,zt,ztm,lines,warn,nrName:nv&&nv[nv.length-1],spName:sv&&sv[sv.length-1]};
}

/* ---------- движок (тот же порядок, что в tools/build_base.py) ---------- */
const unitCache={};
function unitPrice(code){
  if(unitCache[code])return unitCache[code];
  let ot=0,otm=0,em=0,m=0;
  for(const [rc,n] of B.rates[code].comp){const r=B.res[rc];
    if(r.t==='ОТ')ot+=n*r.price;else if(r.t==='ЭМ'){em+=n*r.price;otm+=n*r.otm}else m+=n*r.price}
  return unitCache[code]={ot,otm,em,m};
}
function calc(p){
  if(p.ka)return calcKA(p);if(p.tr)return calcTR(p);const R0=B.rates[p.code];if(!R0)return stub(p);if(R0.real)return calcReal(p,R0);
  const R=B.rates[p.code],U=unitPrice(p.code),sec=B.sections[R.sec];
  const q=p.qty/R.mult;
  let ot=U.ot*q,otm=U.otm*q,emN=U.em*q-U.otm*q,mat=U.m*q;
  let kot=1,kem=1,km=1;
  for(const k of p.ks||[]){const c=B.coeffs[k];kot*=c.ot;kem*=c.em;km*=c.m}
  ot*=kot;otm*=kem;emN*=kem;mat*=km;
  const I=S.idx?B.idx[S.idx]:null;
  if(I){ot*=I.ot;otm*=I.otm;emN*=I.em;mat*=I.m}
  ot=r2(ot);otm=r2(otm);emN=r2(emN);mat=r2(mat);
  const em=r2(emN+otm),direct=r2(ot+em+mat),fot=r2(ot+otm);
  const nr=r2(fot*sec.nr/100),sp=r2(fot*sec.sp/100);
  return {R,U,q,kot,kem,km,I,ot,otm,emN,em,mat,direct,fot,nr,sp,total:r2(direct+nr+sp),nrp:sec.nr,spp:sec.sp};
}
function totals(){
  const t={ot:0,otm:0,em:0,mat:0,per:0,direct:0,fot:0,nr:0,sp:0,total:0,zt:0,ztm:0};
  let mka=0;for(const p of S.pos){if(p.sec!==undefined)continue;const c=calc(p);for(const k in t)t[k]+=c[k]||0;if(c.mka)mka+=c.mka}
  for(const k in t)t[k]=r2(t[k]);t.mka=r2(mka);
  t.nds=S.nds?r2(t.total*B.nds/100):0;t.all=r2(t.total+t.nds);return t;
}

function aiCands(q){if(!RLOW)RLOW=RFULL.map((t,i)=>('гэсн'+RI.r[i][0]+' '+t).toLowerCase().replace(/ё/g,'е'));
  const ws=[...new Set(q.toLowerCase().replace(/ё/g,'е').match(/[а-яa-z0-9]{2,}/g)||[])].map(w=>w.length>5?w.slice(0,w.length>7?w.length-2:w.length-1):w).slice(0,12);if(!ws.length)return [];

  const Q=req(),miss=[['num','номер'],['osn','основание'],['sost','составил'],['prov','проверил']].filter(([k])=>!String(Q[k]||'').trim()).map(x=>x[1]);

/* ---------- формула объёма (без eval) ---------- */
function evalF(src){
  const t=String(src).replace(/\s+/g,'').replace(/,/g,'.').replace(/[×xх·]/g,'*').replace(/[÷:]/g,'/').replace(/[−–]/g,'-');
  if(!t)throw new Error('пусто');let i=0;
  const num=()=>{const m=/^\d+(?:\.\d+)?|^\.\d+/.exec(t.slice(i));if(!m)throw new Error('ожидалось число в позиции '+(i+1));i+=m[0].length;return parseFloat(m[0])};
  const fac=()=>{if(t[i]==='-'){i++;return -fac()}if(t[i]==='+'){i++;return fac()}if(t[i]==='('){i++;const v=ex();if(t[i]!==')')throw new Error('не закрыта скобка');i++;return v}return num()};
  const pw=()=>{let v=fac();if(t[i]==='^'){i++;v=Math.pow(v,fac())}return v};
  const term=()=>{let v=pw();while(t[i]==='*'||t[i]==='/'){const o=t[i++];const w=pw();if(o==='/'&&w===0)throw new Error('деление на ноль');v=o==='*'?v*w:v/w}return v};
  const ex=()=>{let v=term();while(t[i]==='+'||t[i]==='-'){const o=t[i++];const w=term();v=o==='+'?v+w:v-w}return v};
  const v=ex();if(i<t.length)throw new Error('лишний символ «'+t[i]+'»');return Math.round(v*1e6)/1e6}
const isFormula=v=>/[+\-*/×xх:()^]/.test(String(v).trim().replace(/^-/,''));

  return out;
}
function palRender(){
  palItems=palList($('#palq').value);palI=Math.min(palI,Math.max(0,palItems.length-1));let g='',h='';
  palItems.forEach((it,i)=>{if(it.g!==g){g=it.g;h+=`<div class="pg">${g}</div>`}h+=`<div class="it ${i===palI?'on':''}" data-i="${i}">${esc(it.t)}<span class="s">${esc(it.s)}</span></div>`});
  $('#pall').innerHTML=h||'<div class="empty-s">Ничего не найдено</div>';
}
function palOpen(){$('#palbg').classList.add('on');$('#palq').value='';palI=0;palRender();$('#palq').focus()}
function palClose(){$('#palbg').classList.remove('on')}
function palRun(i){const it=palItems[i];if(!it)return;palClose();it.fn()}
$('#palbtn').onclick=palOpen;$('#palq').oninput=()=>{palI=0;palRender()};
$('#pall').onclick=e=>{const it=e.target.closest('.it');if(it)palRun(+it.dataset.i)};
$('#palbg').onclick=e=>{if(e.target.id==='palbg')palClose()};
$('#themebtn').onclick=toggleTheme;themeIcon();
$('#catph').addEventListener('click',e=>{if(e.target.closest('#catbtn')){e.stopPropagation();catShow(document.body.classList.contains('cat-off'));return}if(document.body.classList.contains('cat-off'))catShow(true)});
try{if(localStorage.getItem('sm_cat_off'))catShow(false)}catch(e){}
$('#docname').addEventListener('change',e=>{S.name=e.target.value||'Без названия';markDirty()});
$('#savechip').addEventListener('click',()=>S.docId?openDocs():save());$('#savechip').style.cursor='pointer';
window.addEventListener('beforeunload',e=>{if(saved)return;if(S.docId){storeDoc(true);return}if(S.pos.length){e.preventDefault();e.returnValue=''}});

/* ---------- клавиатура ---------- */
document.addEventListener('keydown',e=>{
  const inField=/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if(!$('#palbg').classList.contains('on')===false){
    if(e.key==='Escape')return palClose();
    if(e.key==='ArrowDown'){e.preventDefault();palI=Math.min(palItems.length-1,palI+1);palRender();$('#pall .it.on')?.scrollIntoView({block:'nearest'})}
    if(e.key==='ArrowUp'){e.preventDefault();palI=Math.max(0,palI-1);palRender();$('#pall .it.on')?.scrollIntoView({block:'nearest'})}
    if(e.key==='Enter'){e.preventDefault();palRun(palI)}return}
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();return palOpen()}
  if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();return save()}
  if(mod&&e.key.toLowerCase()==='o'){e.preventDefault();return openDocs()}
  if(mod&&e.key.toLowerCase()==='p'){e.preventDefault();return openForms()}
  if(e.key==='F7'){e.preventDefault();return openCheck()}
  if(mod&&e.key.toLowerCase()==='z'&&!inField){e.preventDefault();return undo()}
  if(mod&&e.key.toLowerCase()==='y'&&!inField){e.preventDefault();return redoF()}
  if(e.key==='Escape'){closeMenu();$('#dlgbg').classList.remove('on');if(inField)document.activeElement.blur()}
  if(inField)return;
  if(e.key==='/'){e.preventDefault();focusCat()}
  if(e.key==='Delete'||e.key==='Backspace'){del()}
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const i=curIdx();const j=Math.max(0,Math.min(S.pos.length-1,i<0?0:i+(e.key==='ArrowDown'?1:-1)));if(S.pos[j]){sel=S.pos[j].id;render();$(`tr[data-id="${sel}"]`)?.scrollIntoView({block:'nearest'})}}
});

/* ---------- старт ---------- */
try{const t=localStorage.getItem('sm_theme');if(t)document.body.dataset.theme=t;else if(matchMedia('(prefers-color-scheme: dark)').matches)document.body.dataset.theme='dark'}catch(e){}
buildRibbon();renderTree();render();
migrateOld();setSaveChip();{const last=lsGet(SKL);if(last&&location.hash!=='#sample')openDoc(last,true)}
window.__app={get S(){return S},totals,calc,sample,B,ensureReal,nrCode,nrFull,sampleLesson,setBase:v=>setBase(v),renderTable,renderInsp,renderDock,syncRibbon};
if(location.hash==='#sample')sample();
})();
</script>
</body>
